{% extends "base.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-6 py-6">

  <form class="bg-card border border-gray-700 rounded-2xl p-4 mb-6 flex flex-wrap gap-3 items-center"
        hx-post="/runs" hx-target="#run-list" hx-swap="afterbegin" hx-encoding="multipart/form-data"
        hx-on::after-request="this.reset()">
    <input type="file" name="video" accept="video/*" required
           class="text-sm text-gray-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-primary file:text-white file:font-medium file:cursor-pointer hover:file:bg-blue-600 file:transition-colors cursor-pointer">
    <input type="text" name="name" placeholder="Run name" required
           class="bg-dark border border-gray-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-primary transition-colors">
    <input type="text" name="exercise" placeholder="Exercise (e.g. squat)"
           class="bg-dark border border-gray-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-primary transition-colors">
    <input type="number" step="0.5" name="weight" placeholder="Weight (kg)"
           class="bg-dark border border-gray-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-primary transition-colors w-32">
    <button type="submit"
            class="bg-primary hover:bg-blue-600 text-white font-bold px-5 py-2 rounded-lg transition-all transform active:scale-[0.98] ml-auto">
      Analyze
    </button>
  </form>

  <div class="flex gap-6 items-start">
    <aside class="w-80 shrink-0 sticky top-24 max-h-[calc(100vh-7rem)] overflow-y-auto custom-scroll pr-1">
      <div id="run-list" class="space-y-3">
        {% for run in runs %}
          {% include "partials/run_list_item.html" %}
        {% endfor %}
      </div>
    </aside>

    <main id="run-detail-panel" class="flex-1 min-w-0 bg-card border border-gray-700 rounded-2xl p-6">
      <p class="text-gray-500 text-sm">Upload a video or select a run from the list.</p>
    </main>
  </div>
</div>
{% endblock %}
