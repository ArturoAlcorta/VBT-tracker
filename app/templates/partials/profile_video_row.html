<div class="profile-video-row flex items-center gap-2">
  <input type="file" name="videos" accept="video/*" required
         class="min-w-0 flex-1 text-sm text-gray-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-gray-700 file:text-gray-200 file:text-xs file:font-medium file:cursor-pointer hover:file:bg-gray-600 file:transition-colors cursor-pointer">
  <input type="number" step="0.5" min="0" name="weights" placeholder="kg" required
         class="w-24 shrink-0 bg-dark border border-gray-600 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-primary transition-colors">
  <button type="button" aria-label="Remove set"
          class="shrink-0 text-gray-500 hover:text-red-400 px-1 text-xl leading-none transition-colors"
          hx-on:click="if (this.closest('#profile-video-rows').children.length > 1) this.closest('.profile-video-row').remove()">&times;</button>
</div>
