<div id="row-{{ run.id }}" class="run-item bg-card border border-gray-700 rounded-xl p-4 cursor-pointer hover:border-gray-500 active:scale-[0.99] transition-all"
     hx-get="/runs/{{ run.id }}" hx-target="#run-detail-panel" hx-swap="innerHTML"
     hx-on:click="document.querySelectorAll('.run-item').forEach(function(el){ el.classList.remove('border-primary'); el.classList.add('border-gray-700'); }); this.classList.remove('border-gray-700'); this.classList.add('border-primary');">
  <div class="flex items-center justify-between gap-2">
    <p class="text-white text-sm font-medium truncate">{{ run.name }}</p>
    <span id="status-{{ run.id }}" class="run-item-status text-xs px-2 py-1 rounded-full font-medium shrink-0
        {% if run.status == 'done' %}bg-green-500/20 text-green-400
        {% elif run.status == 'error' %}bg-red-500/20 text-red-400
        {% else %}bg-yellow-500/20 text-yellow-400{% endif %}">
      {{ run.status }}
    </span>
  </div>
  <p class="text-gray-500 text-xs mt-1">
    {{ run.exercise or "" }}{% if run.weight %} · {{ run.weight }} kg{% endif %}
  </p>
</div>
{% if run.status in ("pending", "processing") %}
<script>
  watchRun("{{ run.id }}", function (payload) {
    var badge = document.getElementById("status-{{ run.id }}");
    if (badge) badge.textContent = payload.status;
    if (payload.status === "done" || payload.status === "error") {
      htmx.ajax("GET", "/runs/{{ run.id }}/row", {target: "#row-{{ run.id }}", swap: "outerHTML"});
    }
  });
</script>
{% endif %}
