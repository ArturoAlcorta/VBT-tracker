{# Aviso suelto. Los endpoints lo envían dentro de toast_oob.html. #}
<div class="toast bg-card border rounded-xl p-4 shadow-xl flex items-start gap-3
            {% if kind == 'success' %}border-green-500/40{% else %}border-red-500/40{% endif %}">
  <div class="min-w-0 flex-1">
    <p class="text-sm font-semibold {% if kind == 'success' %}text-green-400{% else %}text-red-400{% endif %}">
      {{ title }}
    </p>
    <p class="text-gray-400 text-xs mt-1 leading-relaxed">{{ message }}</p>
    {% if exercise %}
      <button type="button"
              class="mt-3 bg-primary hover:bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition-colors"
              hx-get="/profile/create_profile?exercise={{ exercise.value | urlencode }}"
              hx-target="#profile-modal-container" hx-swap="innerHTML"
              hx-on:click="this.closest('.toast').remove()">
        Build profile
      </button>
    {% endif %}
  </div>
  <button type="button" aria-label="Dismiss"
          class="text-gray-500 hover:text-white text-xl leading-none shrink-0"
          hx-on:click="this.closest('.toast').remove()">&times;</button>
</div>
