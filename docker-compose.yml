services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vbt
      POSTGRES_PASSWORD: vbt
      POSTGRES_DB: vbt
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbt"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://vbt:vbt@postgres:5432/vbt
      # Point these at your own RabbitMQ/Redis instances.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@host.docker.internal:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://host.docker.internal:6379/0}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
    extra_hosts:
      # host.docker.internal is a Docker Desktop (Mac/Windows) built-in; on
      # Linux it must be added explicitly for the default URLs above to
      # resolve to your host's Redis/RabbitMQ.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/srv/data
      - ./models:/srv/models:ro
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info -Q vbt
    environment:
      DATABASE_URL: postgresql+psycopg2://vbt:vbt@postgres:5432/vbt
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-amqp://guest:guest@host.docker.internal:5672//}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://host.docker.internal:6379/0}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      DEVICE: ${DEVICE:-cpu}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/srv/data
      - ./models:/srv/models:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Uncomment to give the worker access to an NVIDIA GPU (requires the
    # nvidia-container-toolkit on the host) and set DEVICE=0 above.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pg-data:
