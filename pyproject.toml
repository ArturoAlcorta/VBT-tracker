[project]
name = "vbt-tracker"
version = "0.1.0"
description = "Velocity-based training tracker: YOLO disk segmentation + FastAPI/Celery web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "celery>=5.4",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "ultralytics>=8.3.0",
    "lap>=0.5.12",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
